# Render Blueprint — ONE free web service runs the website, the API and live chat together
# at https://mivanjari.com. Database: Supabase (Singapore). Photos: Cloudinary. Login emails: Brevo.
# Render dashboard → New → Blueprint → pick this GitHub repo → fill in the values marked `sync: false`
# (see docs/DEPLOY.md for where each one comes from).
services:
  - type: web
    name: mi-vanjari
    runtime: node
    plan: free # upgrade to "starter" (~$7/month) in the dashboard for more speed and no sleeping
    region: singapore # same region as the Supabase database → fast queries
    # install → build the website → database tables → starter content (safe to repeat; never deletes data)
    buildCommand: npm ci --include=dev && npm run build && npm run db:generate -w backend && npm run db:deploy -w backend && npm run db:starter -w backend
    startCommand: npm start -w backend
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Supabase → Connect → ORMs → Prisma. Both with your database password filled in.
      # DATABASE_URL = the port 6543 line (ends with ?pgbouncer=true), DIRECT_URL = the port 5432 line
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # the site's address (Render also allows its own onrender.com address automatically)
      - key: PUBLIC_API_URL
        value: https://mivanjari.com
      - key: CORS_ORIGIN
        value: https://mivanjari.com,https://www.mivanjari.com
      # login security keys — Render generates long random values
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SAMESITE
        value: lax
      - key: TRUST_PROXY
        value: "1"
      # admin login at /admin/login
      - key: ADMIN_EMAILS
        value: mivanjari1111@gmail.com
      # email (login codes) — Brevo → SMTP & API → API keys
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Mi Vanjari <mivanjari1111@gmail.com>
      # photos — Cloudinary → Settings → API Keys
      - key: CLOUDINARY_CLOUD_NAME
        value: dcmyvkpl5
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # payments — Razorpay (can be added later, before 1 December)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
